<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin &middot; Next Move</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,500&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap" style="max-width:420px; padding-block:80px;">
    <span class="eyebrow">Next Move</span>
    <h1 style="margin-top:10px; font-size:1.7rem;">Admin</h1>
    {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
    <form method="post" style="margin-top:24px; display:grid; gap:16px;">
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autofocus required>
      </div>
      <button class="btn" type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
